# Tests de Mana Orbit (voir DEV.md).
# · Chaque push / pull request : build à jour (deck-deal.html = build de src/).
# · Puis TOUS les tests de tests/run-tests.sh (Node, jsdom et navigateur, ~22 min) : un nouveau test listé là y est lancé d'office.
#   On pousse directement sur main (déployé par Hostinger) : les tests navigateur doivent tourner à chaque push, pas seulement en pull request.
name: Tests
on:
  push:
    paths-ignore: ['pwa/edh.bin.gz', 'pwa/fr-names.tsv', '**.md']
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Build à jour
        run: |
          node build.mjs
          git diff --exit-code -- deck-deal.html edhbin.cjs || { echo "::error::deck-deal.html ou edhbin.cjs ne correspond pas à src/ : lance node build.mjs et committe le résultat"; exit 1; }
      - name: Dépendances de test
        run: cd tests && npm ci && npm run fb
      - name: Chromium
        run: |
          cd tests && npx playwright-core install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil      # scan-e2e : images et vidéo de la caméra simulée
          echo "CHROMIUM=$(node -p "require('playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Tous les tests (Node, jsdom et navigateur)
        run: bash tests/run-tests.sh
      - name: Journaux
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: tests/logs/
