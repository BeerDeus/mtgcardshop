# Tests de Mana Orbit (voir DEV.md).
# · Chaque push / pull request : build à jour (deck-deal.html = build de src/).
# · Push : tests Node et jsdom (~2 min, `run-tests.sh --node`).
# · Pull request et lancement manuel : TOUS les tests de tests/run-tests.sh, Node compris (~22 min) : un nouveau test listé là y est lancé d'office.
name: Tests
on:
  push:
    paths-ignore: ['pwa/edh.bin.gz', 'pwa/fr-names.tsv', '**.md']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Suite complète (navigateur)'
        type: boolean
        default: true
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Build à jour
        run: |
          node build.mjs
          git diff --exit-code -- deck-deal.html edhbin.cjs || { echo "::error::deck-deal.html ou edhbin.cjs ne correspond pas à src/ : lance node build.mjs et committe le résultat"; exit 1; }
      - name: Dépendances de test
        run: cd tests && npm ci && npm run fb
      - name: Tests Node et jsdom
        if: github.event_name != 'pull_request' && !inputs.full
        run: bash tests/run-tests.sh --node
      - name: Chromium
        if: github.event_name == 'pull_request' || inputs.full
        run: |
          cd tests && npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -p "require('playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Tous les tests (Node, jsdom et navigateur)
        if: github.event_name == 'pull_request' || inputs.full
        run: bash tests/run-tests.sh
      - name: Journaux
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: tests/logs/
