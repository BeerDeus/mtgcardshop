# Catalogue des noms de cartes en français (pwa/fr-names.tsv), régénéré chaque semaine depuis l'API Scryfall.
# L'app le télécharge en une requête ; s'il manque, elle pagine l'API Scryfall elle-même (plus lent). Lancement manuel : onglet Actions › Run workflow.
name: Catalogue des noms français
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fr-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer pwa/fr-names.tsv
        run: node gen-fr-names.mjs 2>&1 | tee gen.log; exit ${PIPESTATUS[0]}
      - name: Erreur (dernières lignes du journal en annotation)
        if: failure()
        run: echo "::error title=gen-fr-names::$(tail -c 900 gen.log | sed ':a;N;$!ba;s/\n/ | /g')"
      - name: Commit si le fichier a changé
        run: |
          git config user.name "deck-deal-bot"
          git config user.email "deck-deal-bot@users.noreply.github.com"
          git add pwa/fr-names.tsv
          if git diff --cached --quiet; then echo "Aucun changement."; else git commit -m "Catalogue FR : mise à jour automatique" && git push; fi
